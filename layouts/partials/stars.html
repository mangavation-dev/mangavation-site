{{- /* Star rating out of 7. Unicode glyphs, matching the theme's ☀ ☾ ⌕ ↑ ↓ ↵ →
       approach — no icon font, no extra request. Takes a number. */ -}}
{{- $r := . | int -}}
{{- range seq 7 -}}
  {{- if le . $r }}<span class="star is-full">★</span>{{ else }}<span class="star">☆</span>{{ end -}}
{{- end -}}
